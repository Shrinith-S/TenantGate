<h2>Available Tenants</h2>

<p>Tenant count: {{ tenants.length }}</p>

@for (tenant of tenants; track tenant.id) {
  <div>
    <button
      type="button"
      (click)="selectTenant(tenant)">

      {{ tenant.name }} - {{ tenant.entraTenantId }}

    </button>
  </div>
}

@if (selectedTenant; as tenant) {
  <div>
    <h3>Selected Tenant</h3>
    <p>{{ tenant.name }}</p>
    <p>{{ tenant.entraTenantId }}</p>
  </div>
}
